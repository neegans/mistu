#mito-mobile-preview .mito-source-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0;}
#mito-mobile-preview .mito-source{position:relative;background:var(--mito-paper);border:1px solid var(--mito-line);border-radius:10px;padding:11px 8px 8px;text-align:center;min-width:0;}
#mito-mobile-preview .mito-source.pending{border-color:var(--mito-olive);background:var(--mito-soft);}
#mito-mobile-preview .mito-sheet{display:flex;align-items:center;justify-content:center;height:57px;color:var(--mito-muted);margin-bottom:5px;}
#mito-mobile-preview .mito-sheet svg{height:34px;width:28px;stroke-width:1;}
#mito-mobile-preview .mito-source-label{font-size:12px;display:block;}
#mito-mobile-preview .mito-source-state{color:var(--mito-muted);font-size:11px;display:block;margin-top:3px;}
#mito-mobile-preview .mito-source-tools{display:flex;justify-content:center;gap:5px;margin-top:6px;}
#mito-mobile-preview .mito-source-tools button{border:0;background:transparent;min-width:34px;min-height:34px;display:grid;place-items:center;border-radius:7px;color:var(--mito-muted);}
#mito-mobile-preview .mito-source-tools button:hover{background:var(--mito-soft);}
#mito-mobile-preview .mito-source-tools svg{width:15px;height:15px;}
#mito-mobile-preview .mito-update-box{border-top:1px solid var(--mito-line);padding-top:17px;margin-top:20px;}
#mito-mobile-preview .mito-update-box .mito-copy{margin:0 0 12px;}
#mito-mobile-preview .mito-message{padding:13px 14px;border-radius:10px;background:var(--mito-soft);color:var(--mito-olive);font-size:13px;line-height:1.5;margin:13px 0;}
#mito-mobile-preview .mito-message strong{font-weight:500;}
#mito-mobile-preview .mito-message small{display:block;margin-top:4px;font-size:11px;}
#mito-mobile-preview .mito-warning{background:var(--mito-warm);color:var(--mito-warm-ink);}
#mito-mobile-preview .mito-back{margin:-10px 0 13px -7px;font-size:12px;}
#mito-mobile-preview .mito-pick{margin:17px 0;border:1px solid var(--mito-line);background:var(--mito-paper);border-radius:12px;padding:19px;display:flex;gap:15px;align-items:center;}
#mito-mobile-preview .mito-pick svg{width:34px;height:44px;color:var(--mito-olive);stroke-width:1;}
#mito-mobile-preview .mito-pick strong{display:block;font-weight:500;}
#mito-mobile-preview .mito-pick small{color:var(--mito-muted);}
#mito-mobile-preview .mito-cook-head{padding:17px 20px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--mito-line);}
#mito-mobile-preview .mito-cook-head h1{font:24px/1.1 Georgia,&quot;Times New Roman&quot;,serif;letter-spacing:-.5px;}
#mito-mobile-preview .mito-cook-head small{display:block;font-size:11px;color:var(--mito-muted);margin-top:4px;}
#mito-mobile-preview .mito-cook-head button{min-width:40px;min-height:40px;border:0;background:transparent;display:grid;place-items:center;border-radius:10px;}
#mito-mobile-preview .mito-cook-body{padding:20px;}
#mito-mobile-preview .mito-cook-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--mito-muted);margin-bottom:11px;}
#mito-mobile-preview .mito-language{display:flex;gap:3px;}
#mito-mobile-preview .mito-language button{border:0;background:transparent;font-size:11px;min-height:32px;padding:5px 8px;border-radius:7px;color:var(--mito-muted);}
#mito-mobile-preview .mito-language button[aria-pressed=true]{background:var(--mito-soft);color:var(--mito-olive);}
#mito-mobile-preview .mito-progress{height:4px;border-radius:2px;background:var(--mito-line);margin-bottom:22px;overflow:hidden;}
#mito-mobile-preview .mito-progress span{display:block;height:100%;background:var(--mito-olive);transition:width .2s;}
#mito-mobile-preview .mito-step-title{font:32px/1.1 Georgia,&quot;Times New Roman&quot;,serif;letter-spacing:-.7px;margin-bottom:15px;}
#mito-mobile-preview .mito-instructions{font-size:17px;line-height:1.65;}
#mito-mobile-preview .mito-instructions p+p{margin-top:12px;}
#mito-mobile-preview .mito-ingredients{margin:21px 0 16px;border:1px solid var(--mito-line);border-radius:11px;background:var(--mito-paper);}
#mito-mobile-preview .mito-ingredients summary{min-height:47px;padding:13px;font-size:12px;color:var(--mito-muted);}
#mito-mobile-preview .mito-ingredient-list{list-style:none;margin:0;padding:0 13px 7px;}
#mito-mobile-preview .mito-ingredient-list li{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-top:1px solid var(--mito-line);font-size:13px;}
#mito-mobile-preview .mito-ingredient-list strong{font-weight:500;white-space:nowrap;}
#mito-mobile-preview .mito-timer{padding:12px 13px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--mito-soft);color:var(--mito-olive);border-radius:11px;margin-top:16px;}
#mito-mobile-preview .mito-timer strong{display:block;font-size:14px;font-weight:500;}
#mito-mobile-preview .mito-timer small{display:block;font-size:11px;}
#mito-mobile-preview .mito-timer-options{display:flex;gap:8px;margin-top:10px;}
#mito-mobile-preview .mito-bottom-actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:15px 20px 18px;border-top:1px solid var(--mito-line);background:var(--mito-paper);}
#mito-mobile-preview .mito-note{font-size:11px;color:var(--mito-muted);margin-top:13px;}
#mito-mobile-preview .mito-import-area{border:1px dashed var(--mito-line);border-radius:12px;min-height:140px;display:flex;gap:12px;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;margin:18px 0;color:var(--mito-muted);font-size:13px;}
#mito-mobile-preview .mito-import-area&gt;svg{width:29px;height:29px;}
#mito-mobile-preview .mito-toast{max-width:418px;margin:10px auto 0;font-size:12px;color:var(--mito-muted);padding:0 7px;min-height:18px;}
#mito-mobile-preview .mito-empty{padding:28px 0;color:var(--mito-muted);font-size:13px;}
#mito-mobile-preview .mito-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
@media(max-width:359px){#mito-mobile-preview .mito-body,#mito-mobile-preview .mito-cook-body{padding:17px;}#mito-mobile-preview .mito-brand{padding-inline:17px;}#mito-mobile-preview .mito-source-grid{gap:7px;}#mito-mobile-preview .mito-preview-label{font-size:10px;letter-spacing:.03em;}#mito-mobile-preview .mito-recipe h3{font-size:22px;}#mito-mobile-preview .mito-step-title{font-size:29px;}}
@media(prefers-reduced-motion:reduce){#mito-mobile-preview .mito-progress span{transition:none;}}
@media(pointer:coarse){#mito-mobile-preview .mito-preview-switch button,#mito-mobile-preview .mito-small,#mito-mobile-preview .mito-filter,#mito-mobile-preview .mito-language button{min-height:44px;}#mito-mobile-preview .mito-favorite{min-width:44px;min-height:44px;}#mito-mobile-preview .mito-source-grid{grid-template-columns:repeat(auto-fit,minmax(106px,1fr));}#mito-mobile-preview .mito-source-tools{gap:0;}#mito-mobile-preview .mito-source-tools button{min-width:44px;min-height:44px;}}
&lt;/style&gt;
