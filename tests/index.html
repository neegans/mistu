<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Cuisine OS — tests du domaine</title>

    body { font-family: -apple-system, Helvetica, Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #f6f1e7; color: #1d231f; }
