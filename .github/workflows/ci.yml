name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          package-manager-cache: false

      - name: Vérifier les fichiers suivis pour les secrets
        run: node tools/ci/verifier-secrets.mjs

      - name: Vérifier les outils Node
        run: node --test --test-concurrency=1 tools/*.test.mjs

      - name: Vérifier les migrations générées
        run: node tools/generer-migrations.mjs --check

      - name: Vérifier la livraison générée
        run: node tools/generer-livraison.mjs --check

      - name: Installer les dépendances de vérification
        run: npm ci --prefix tools/ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Installer Chromium et ses dépendances
        run: node tools/ci/node_modules/playwright/cli.js install --with-deps chromium

      - name: Vérifier les outils CI
        run: node --test --test-concurrency=1 tools/ci/*.test.mjs

      - name: Vérifier la suite dans Chromium
        run: node tools/ci/verifier-navigateur.mjs

      - name: Conserver le reçu navigateur
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-navigateur
          path: artifacts/ci-navigateur
          include-hidden-files: false
          if-no-files-found: ignore
          retention-days: 7
